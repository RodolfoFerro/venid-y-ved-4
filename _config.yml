# --- Identidad del sitio -----------------------------------------------------
title: Venid y Ved 4
description: Repositorio del módulo Venid y Ved 4
lang: es-MX

# URL de publicación en GitHub Pages (project page).
# Repo: rodolfoferro/venid-y-ved-4  ->  https://rodolfoferro.github.io/venid-y-ved-4/
url: "https://rodolfoferro.github.io"
baseurl: "/venid-y-ved-4"

# --- Tema ------------------------------------------------------------------
# GitHub Pages (Deploy from a branch) no admite el gem del tema, así que se
# usa remote_theme, que sí está soportado. Versión fijada con @v0.12.0.
remote_theme: just-the-docs/just-the-docs@v0.12.0

permalink: pretty

# --- Búsqueda -------------------------------------------------------------
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# --- Navegación y layout ------------------------------------------------
color_scheme: light
back_to_top: true
back_to_top_text: "Volver arriba"

heading_anchors: true

aux_links:
aux_links_new_tab: true

# Enlace "Editar esta página en GitHub" en el pie de cada página
gh_edit_link: true
gh_edit_link_text: "Editar esta página en GitHub"
gh_edit_repository: "https://github.com/rodolfoferro/venid-y-ved-4"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

last_edit_timestamp: true
last_edit_time_format: "%d %b %Y, %H:%M"

# Pie de página
footer_content: 'Copyright &copy; 2026 Rodolfo Ferro. Distribuido bajo licencia MIT.'

# --- Callouts (llamadas de atención) ---------------------------------
callouts_level: quiet
callouts:
  note:
    title: Nota
    color: blue
  warning:
    title: Atención
    color: yellow
  important:
    title: Importante
    color: red

# --- Plugins ------------------------------------------------------------
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

# --- Exclusiones del build --------------------------------------------
exclude:
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - LICENSE
